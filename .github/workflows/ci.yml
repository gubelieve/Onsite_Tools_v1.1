# CI for both editions kept in this repository:
#   * Onsite_Tools_v3 - the Next.js / TypeScript web app (lint, typecheck, tests, build)
#   * the v1.1 PySide6 desktop app at the repository root - no automated tests, only a syntax gate
# The Python v2 web edition was removed in favour of v3.

name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  desktop-v1:
    name: Lint the v1.1 desktop app
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install flake8
      run: python -m pip install --upgrade pip flake8
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  web-v3:
    name: Onsite_Tools_v3
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Onsite_Tools_v3
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: Onsite_Tools_v3/package-lock.json
    - name: Install dependencies
      run: npm ci --no-audit --no-fund
    - name: Create the local SQLite database
      run: npx prisma db push
    - name: Lint and typecheck
      run: |
        npm run lint
        npm run typecheck
    - name: Unit tests (parsers, inventory, SSH driver against a fake device)
      run: npm test
    - name: Production build
      run: npm run build
