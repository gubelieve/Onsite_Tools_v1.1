# Lint the repository and run the Onsite_Tools_v2 test-suite on several Python versions.
# The v1.1 desktop app (PySide6) has no automated tests; it is only linted for syntax errors.

name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: Onsite_Tools_v2/requirements-dev.txt
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Test dependencies only - device libraries (netmiko, pysnmp, selenium, pandas) are imported lazily
        python -m pip install -r Onsite_Tools_v2/requirements-dev.txt
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        pytest Onsite_Tools_v2/tests -q

  # Onsite_Tools_v3 - Next.js / TypeScript edition (no Python)
  web-v3:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Onsite_Tools_v3
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: Onsite_Tools_v3/package-lock.json
    - name: Install dependencies
      run: npm ci --no-audit --no-fund
    - name: Create the local SQLite database
      run: npx prisma db push
    - name: Lint and typecheck
      run: |
        npm run lint
        npm run typecheck
    - name: Unit tests (parsers, inventory, SSH driver against a fake device)
      run: npm test
    - name: Production build
      run: npm run build
