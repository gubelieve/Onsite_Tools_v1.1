# Same layout as Lab_management: the app is only reachable through nginx, the
# real DATABASE_URL arrives at run time from .env.production (never at build).
#
#   docker compose --env-file .env.production up -d --build

services:
  app:
    build: .
    env_file: .env.production
    restart: unless-stopped
    expose:
      - "3000"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  nginx:
    image: nginx:stable
    ports:
      - "8020:8020"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
